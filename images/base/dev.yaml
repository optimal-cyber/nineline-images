# The -dev variant: the production image plus a shell, busybox and apk, for
# debugging and for building. Never the image that ships.
include: image.yaml

contents:
  packages:
    - busybox
    - bash
    - apk-tools

annotations:
  org.opencontainers.image.title: "NINELINE base (dev)"
  org.opencontainers.image.description: "NINELINE base plus bash, busybox and apk-tools for debugging. Not for production."
