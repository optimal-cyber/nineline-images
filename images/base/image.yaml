# NINELINE base: glibc, CA certificates and tzdata from Wolfi, nothing else.
# No shell, no package manager, runs as uid 65532. Built and signed by
# .github/workflows/factory.yml; `local-kit/build_and_scan.sh` builds it on a laptop.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - glibc
    - tzdata

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: "NINELINE base"
  org.opencontainers.image.description: "Minimal glibc base from Wolfi packages: no shell, no package manager, non-root."
  org.opencontainers.image.vendor: "Optimal, LLC"
  org.opencontainers.image.source: "https://github.com/optimal-cyber/nineline-images"
  org.opencontainers.image.url: "https://9line.gooptimal.io"
