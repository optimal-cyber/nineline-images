# NINELINE nginx: nginx mainline from Wolfi on the NINELINE base, running as
# uid 65532. The `-privileged-netbindservice` package is the same nginx binary
# with cap_net_bind_service, so the non-root process can bind port 80 as the
# packaged config expects. The prefix is /var/lib/nginx (temp and log dirs owned
# by the runtime user); the pid file is moved there because /run is not writable.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - glibc
    - tzdata
    - nginx-mainline
    - nginx-mainline-config
    - nginx-mainline-privileged-netbindservice

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /var/lib/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/bin/nginx -c /etc/nginx/nginx.conf -e /dev/stderr -g "daemon off; pid /var/lib/nginx/nginx.pid;"

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: "NINELINE nginx"
  org.opencontainers.image.description: "nginx mainline from Wolfi packages on the NINELINE base: no shell, no package manager, non-root, binds :80 via cap_net_bind_service."
  org.opencontainers.image.vendor: "Optimal, LLC"
  org.opencontainers.image.source: "https://github.com/optimal-cyber/nineline-images"
  org.opencontainers.image.url: "https://9line.gooptimal.io"
