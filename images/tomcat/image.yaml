# NINELINE tomcat: Apache Tomcat 11 on OpenJDK 21 from Wolfi, on the NINELINE
# base. There is no shell, so catalina.sh is not used: the entrypoint starts
# Bootstrap with `java` directly, with the same system properties catalina.sh
# sets. CATALINA_HOME and CATALINA_BASE are /usr/share/tomcat; the directories
# Tomcat writes at runtime are owned by uid 65532. webapps/ is empty, as in the
# upstream image; the default ROOT application is in webapps.dist/.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - glibc
    - tzdata
    - tomcat-11.0-openjdk-21

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: "65532"

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  CATALINA_HOME: /usr/share/tomcat
  CATALINA_BASE: /usr/share/tomcat
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

work-dir: /usr/share/tomcat

paths:
  - path: /usr/share/tomcat/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/webapps
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/conf/Catalina
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/bin/java -Djava.util.logging.config.file=/usr/share/tomcat/conf/logging.properties -Djava.util.logging.manager=org.apache.juli.ClassLoaderLogManager -Dcatalina.home=/usr/share/tomcat -Dcatalina.base=/usr/share/tomcat -Djava.io.tmpdir=/usr/share/tomcat/temp -classpath /usr/share/tomcat/bin/bootstrap.jar:/usr/share/tomcat/bin/tomcat-juli.jar org.apache.catalina.startup.Bootstrap start

archs:
  - x86_64
  - aarch64

annotations:
  org.opencontainers.image.title: "NINELINE tomcat"
  org.opencontainers.image.description: "Apache Tomcat 11 on OpenJDK 21 from Wolfi packages on the NINELINE base: no shell, no package manager, non-root."
  org.opencontainers.image.vendor: "Optimal, LLC"
  org.opencontainers.image.source: "https://github.com/optimal-cyber/nineline-images"
  org.opencontainers.image.url: "https://9line.gooptimal.io"
